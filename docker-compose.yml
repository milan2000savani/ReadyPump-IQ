services:
  # 1. Database
  db:
    image: postgres:15-alpine
    container_name: heat_pump_db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.init
    container_name: heat_pump_api
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  # 3. React Frontend
  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    container_name: heat_pump_dashboard
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
  

volumes:
  postgres_data: